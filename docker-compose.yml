services:
  overtide:
    build: .
    container_name: overtide
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=America/Toronto
    ports:
      # OVERTIDE_PORT, in a .env file beside this one, moves it off 8088
      # (where Stewarr may already be).
      - "${OVERTIDE_PORT:-8088}:8088"
    volumes:
      - ./config:/config
      - /mnt/media:/data
      - /mnt/torrents:/torrent-cache
