# Checks every push and pull request: formatting, vet, static analysis,
# known vulnerabilities, tests (with the race detector), and the web
# assets: their TypeScript type-checked, and the committed bundles the
# same as a fresh build of their sources.
name: CI

on:
  push:
  pull_request:
  # The release workflow runs these checks first.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Tests
        run: go test -race ./...

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # .npmrc turns install scripts off.
      - name: The panel
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: The built panel matches its sources
        run: |
          git diff --exit-code -- internal/httpui/dist || { echo "internal/httpui/dist is out of date: run npm run build in frontend/ and commit it"; exit 1; }
          test -z "$(git status --porcelain -- internal/httpui/dist)" || { git status -- internal/httpui/dist; exit 1; }
